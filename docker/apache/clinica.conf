ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/clinica/public
    DirectoryIndex index.php

    <Directory /var/www/clinica>
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /var/www/clinica/public>
        Options -Indexes -Includes -ExecCGI
        AllowOverride None
        Require all granted
        # Controlador frontal, conservando URI, método y parámetros; assets existentes se sirven directamente.
        FallbackResource /index.php
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    # No registrar query strings: las búsquedas pueden contener datos de pacientes.
    CustomLog /proc/self/fd/1 "%a %t \"%m %U %H\" %>s %b"
</VirtualHost>
